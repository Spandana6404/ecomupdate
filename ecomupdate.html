<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .category-card { padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
    </style>
</head>
<body>
    
   
    <section id="about" class="container mt-5">
        <h2>About Us</h2>
        <div class="container">
            <p>We are a family-owned business.</p>
        </div>
    </section>
    
   
    <section id="products" class="container mt-5">
        <h2>Our Products</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="category-card">Category 1</div>
            </div>
            <div class="col-md-4">
                <div class="category-card">Category 2</div>
            </div>
            <div class="col-md-4">
                <div class="category-card">Category 3</div>
            </div>
        </div>
    </section>
    
   
    <section id="gallery" class="container mt-5">
        <h2>Gallery</h2>
        <div class="row">
            <div class="col-md-4">
                <img src="https://via.placeholder.com/300" class="img-fluid" alt="Gallery Image">
            </div>
        </div>
    </section>
    
   
    <section id="contact" class="container mt-5">
        <h2>Contact Us</h2>
        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        <button type="button" class="btn btn-secondary mt-3" data-bs-toggle="modal" data-bs-target="#loginModal">
            Login
        </button>
    </section>
    
    
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="login-email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="login-email" required>
                        </div>
                        <div class="mb-3">
                            <label for="login-password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="login-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
